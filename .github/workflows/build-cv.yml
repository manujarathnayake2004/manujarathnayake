name: Build portfolio CV

on:
  push:
    paths:
      - 'cv_chunks/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild CV
        shell: bash
        run: |
          cat cv_chunks/all.part | tr -d '\n' | base64 -d | xz -d > Manuja_Rathnayake_CV.pdf
          test -s Manuja_Rathnayake_CV.pdf
          file Manuja_Rathnayake_CV.pdf
      - name: Commit updated CV
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Manuja_Rathnayake_CV.pdf
          git diff --cached --quiet || git commit -m "Add updated portfolio CV"
          git push
