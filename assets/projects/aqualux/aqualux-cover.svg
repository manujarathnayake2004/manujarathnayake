  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#061b20" stop-opacity=".97"/><stop offset=".62" stop-color="#061b20" stop-opacity=".46"/><stop offset="1" stop-color="#061b20" stop-opacity=".12"/></linearGradient>
